# Déploiement Render — "Blueprint" (déploiement automatique depuis le repo).
# Render détecte ce fichier et crée le service tout seul. Sinon, voir DEPLOY.md (méthode manuelle).
services:
  - type: web
    name: pong-line
    runtime: node
    plan: free
    # Pas de build, et c'est voulu : le projet n'a AUCUNE dépendance. Un `npm install` / `yarn install`
    # ne fait rien d'utile, régénère un lockfile à chaque build, et ouvre une porte par laquelle une
    # dépendance pourrait s'introduire. Render exigeant une commande non vide, on met un no-op qui
    # affiche au passage la version de Node réellement installée (vérifie que `.node-version` est pris).
    buildCommand: node --version
    startCommand: npm start
    autoDeploy: true
    # Une seule instance : la salle et la partie vivent EN MÉMOIRE dans le hub.
    # Avec deux instances, les joueurs tomberaient sur des serveurs différents sans jamais se voir.
    numInstances: 1
