<!DOCTYPE html>
<!-- (?mesure=1 : temps de dessin de chaque décor à la résolution du jeu — à ouvrir sur le téléphone)
     GALERIE des circuits de Micro Machines : chaque circuit dessiné en entier avec le vrai rendu du jeu
     (public/games/micro/rendu.js) et ses obstacles mobiles animés. Non liée depuis le site : elle sert à vérifier les
     décors et à choisir ses circuits. Données : public/games/micro/circuits/<id>.js. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0c16">
<title>Circuits Micro Machines</title>
<style>
:root{ --ground:#0a0c16; --panel:#161a2d; --line:rgba(255,255,255,.10); --ink:#eef0fb; --muted:#8e96b8; --yel:#ffd23a; color-scheme:dark; }
*{ -webkit-box-sizing:border-box; box-sizing:border-box; }
html,body{ margin:0; }
body{ background:var(--ground); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:14px; padding:16px; }
h1{ font-size:20px; margin:0 0 4px; }
.sous{ color:var(--muted); margin:0 0 16px; line-height:1.4; }
.carte{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:16px; }
.carte h2{ font-size:16px; margin:0 0 2px; color:var(--yel); }
.carte p{ margin:0 0 8px; color:var(--muted); }
.carte canvas{ display:block; width:100%; height:auto; border-radius:8px; background:#000; }
.chiffres{ font-size:12px; color:var(--muted); margin-top:6px; }
table.mes{ border-collapse:collapse; width:100%; max-width:560px; font-size:14px; }
table.mes td, table.mes th{ padding:6px 8px; border-bottom:1px solid var(--line); text-align:right; }
table.mes td:first-child, table.mes th:first-child{ text-align:left; }
table.mes .lent{ color:#ff8a7a; font-weight:700; }
body.nu{ padding:0; } body.nu h1, body.nu .sous, body.nu .carte h2, body.nu .carte p, body.nu .chiffres{ display:none; }
body.nu .carte{ padding:0; border:0; margin:0; border-radius:0; } body.nu .carte canvas{ border-radius:0; }
</style>
</head>
<body>
<h1>Circuits de Micro Machines</h1>
<p class="sous">Chaque circuit vu d'en haut, avec son décor et ses obstacles mobiles en mouvement. La ligne à damier est le départ.</p>
<div id="liste"></div>
<script type="module">
import { CIRCUITS, circuitParId, mobile } from './games/micro/shared.js';
import './games/micro/circuits/index.js';              // la galerie montre tout : elle enregistre les 12 définitions
import { peindreCircuit, mobileDessin } from './games/micro/rendu.js';
const liste = document.getElementById('liste'), vues = [];
// ?id=jardin,noel : seulement ces circuits (dessinés plus grand) ; ?inv=1 : sens inverse
const qs = new URLSearchParams(location.search), choix = (qs.get('id') || '').split(',').filter(Boolean), inv = qs.get('inv') === '1';
if (qs.get('nu') === '1') document.body.className = 'nu';   // ?nu=1 : le dessin seul, sans titres (captures d'écran)
// ?mesure=1 : pas de galerie, mais le TEMPS DE DESSIN du décor de chaque circuit à la résolution que le jeu utilise
// (même calcul que ensureDecor de client.js : 1,15 px par u au plus, 8 M pixels au plus). À ouvrir sur le téléphone : c'est
// l'attente au moment où un circuit apparaît. Deux passes par circuit (la première paie aussi la mise en route du moteur JS).
if (qs.get('mesure') === '1') {
  document.querySelector('.sous').textContent = 'Temps de dessin du décor de chaque circuit, à la résolution du jeu sur cet appareil. Au-delà de 300 ms, l\'arrivée sur le circuit se voit.';
  const t = document.createElement('table'); t.className = 'mes';
  t.innerHTML = '<tr><th>Circuit</th><th>Image</th><th>1er dessin</th><th>2e dessin</th></tr>';
  liste.appendChild(t);
  const note = document.createElement('p'); note.className = 'sous'; note.style.marginTop = '12px'; liste.appendChild(note);
  const cv = document.createElement('canvas'); let k = 0, pire = 0, somme = 0;
  const suivant = () => {
    if (k >= CIRCUITS.length) { note.textContent = 'Total ' + Math.round(somme) + ' ms · le plus long : ' + Math.round(pire) + ' ms · ' + navigator.userAgent.replace(/^Mozilla\/5\.0 /, ''); cv.width = cv.height = 0; return; }
    const d = CIRCUITS[k++], c = circuitParId(d.id, false);
    const q = Math.round(Math.min(1.15, Math.sqrt(8e6 / (c.w * c.h))) * 20) / 20;
    const temps = [];
    for (let p = 0; p < 2; p++) {
      cv.width = Math.round(c.w * q); cv.height = Math.round(c.h * q);
      const g = cv.getContext('2d'); g.setTransform(q, 0, 0, q, 0, 0);
      const t0 = performance.now(); peindreCircuit(g, c, {}); g.getImageData(0, 0, 1, 1); temps.push(performance.now() - t0);   // getImageData : force le dessin à se terminer
    }
    pire = Math.max(pire, temps[0]); somme += temps[0];
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + d.emoji + ' ' + d.nom + '</td><td>' + cv.width + ' × ' + cv.height + '</td><td class="' + (temps[0] > 300 ? 'lent' : '') + '">' + Math.round(temps[0]) + ' ms</td><td>' + Math.round(temps[1]) + ' ms</td>';
    t.appendChild(tr);
    setTimeout(suivant, 60);
  };
  setTimeout(suivant, 200);
} else {
for (const d of CIRCUITS) {
  if (choix.length && choix.indexOf(d.id) < 0) continue;
  const c = circuitParId(d.id, inv), carte = document.createElement('section'); carte.className = 'carte';
  const h = document.createElement('h2'); h.textContent = d.emoji + ' ' + d.nom;
  const p = document.createElement('p'); p.textContent = d.sous;
  const cv = document.createElement('canvas'), ch = document.createElement('div'); ch.className = 'chiffres';
  ch.textContent = 'Longueur ' + Math.round(c.L) + ' u · piste ' + 2 * c.W + ' u de large · ' + c.gates.length + ' portes · ' + c.mobs.length + ' obstacle(s) mobile(s) · ' + c.rocks.length + ' obstacle(s) fixe(s)';
  carte.appendChild(h); carte.appendChild(p); carte.appendChild(cv); carte.appendChild(ch); liste.appendChild(carte);
  // décor pré-rendu une fois, à la résolution de l'écran (plafonné), puis recopié à chaque image sous les mobiles
  const larg = +qs.get('larg') || Math.min(choix.length ? 2400 : 1400, Math.max(320, carte.clientWidth - 24)) * Math.min(2, window.devicePixelRatio || 1);   // ?larg=3000 : résolution imposée
  // ?vue=x0,y0,x1,y1 : seulement ce rectangle du monde (u), en grand — pour regarder un décor de près
  const vu = (qs.get('vue') || '').split(',').map(Number), rect = vu.length === 4 && vu[2] > vu[0] && vu[3] > vu[1] ? vu : [0, 0, c.w, c.h];
  const q = larg / (rect[2] - rect[0]), ox = -rect[0] * q, oy = -rect[1] * q, fond = document.createElement('canvas');
  fond.width = Math.round((rect[2] - rect[0]) * q); fond.height = Math.round((rect[3] - rect[1]) * q);
  const g = fond.getContext('2d'); g.setTransform(q, 0, 0, q, ox, oy);
  const t0 = performance.now(); peindreCircuit(g, c, {}); const ms = performance.now() - t0;
  ch.textContent += ' · décor dessiné en ' + Math.round(ms) + ' ms (' + fond.width + ' × ' + fond.height + ' px)';
  if (qs.get('repere') === '1') {                      // ?repere=1 : ligne médiane + fractions du tour (0.05 en 0.05), pour placer obstacles et zones
    g.strokeStyle = 'rgba(255,0,200,0.8)'; g.lineWidth = 3; g.beginPath();
    for (let i = 0; i <= c.n; i++) { const j = i % c.n; if (i) g.lineTo(c.sx[j], c.sy[j]); else g.moveTo(c.sx[j], c.sy[j]); }
    g.stroke(); g.font = 'bold 34px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    for (let k = 0; k < 20; k++) {
      const i = Math.round(k / 20 * c.n) % c.n, x = c.sx[i] - c.nx[i] * (c.W + 40), y = c.sy[i] - c.ny[i] * (c.W + 40);
      g.fillStyle = 'rgba(255,0,200,0.9)'; g.beginPath(); g.arc(c.sx[i], c.sy[i], 9, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#000'; g.fillRect(x - 46, y - 22, 92, 44); g.fillStyle = '#fff'; g.fillText((k / 20).toFixed(2), x, y);
    }
  }
  cv.width = fond.width; cv.height = fond.height;
  vues.push({ c, cv, fond, q, ox, oy });
}
const o = { x: 0, y: 0, vx: 0, vy: 0, a: 0 };
function dessiner(now) {
  for (const v of vues) {
    const g = v.cv.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(v.fond, 0, 0);
    g.setTransform(v.q, 0, 0, v.q, v.ox, v.oy);
    for (const m of v.c.mobs) { mobile(m, now / 1000, o); mobileDessin(g, v.c, m, o, now, false); }
  }
}
// ?t=12.5 : image figée à cet instant (s) ; sinon animation. Une première image tout de suite (onglet en arrière-plan : pas de rAF)
const fige = qs.get('t');
dessiner(fige ? +fige * 1000 : performance.now());
if (!fige) { const image = now => { dessiner(now); requestAnimationFrame(image); }; requestAnimationFrame(image); }
}
</script>
</body>
</html>
